name: collect-history-24h

on:
  schedule:
    - cron: "*/5 1-16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect data (16h daily)
        run: node collector.mjs
        env:
          LOOP_SECONDS: 270
      - name: commit and push (safe)
        run: |
          git config user.name "malik-hamza-bot"
          git config user.email "bot@localhost"
          git pull --rebase --autostash || true
          git add data/history.json || true
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "auto: update history $(date -u +%F-%T)" || true
          fi
          for i in 1 2 3; do
            git push && break
            echo "push retry $i..."
            sleep 5
            git pull --rebase --autostash || true
          done
          echo "done"
        continue-on-error: true
