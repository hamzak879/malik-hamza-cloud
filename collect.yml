name: collect-history-24h

on:
  schedule:
    - cron: "*/5 * * * *"   # har 5 min, 24h - laptop OFF ho tab bhi chalega
  workflow_dispatch: {}       # manual button bhi

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Har job ~4.5 min chalega aur andar har 32 sec me data laega = 30-sec wala hisab
      - run: LOOP_SECONDS=270 node collector.mjs
        env:
          LOOP_SECONDS: 270
      - run: |
          git config user.name "malik-hamza-bot"
          git config user.email "bot@localhost"
          git add data/history.json
          git diff --cached --quiet || git commit -m "auto: update history $(date -u +%F-%T)"
          git push
